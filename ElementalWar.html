<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elemental War</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Sorts+Mill+Goudy&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #e9e2d0; --panel: #f6f1e4; --ink: #222; --muted: #6b6455; --line: #cfc5ad;
  --accent: #8a3b12; --good: #2b8a3e; --bad: #c92a2a; --sel: #ffd43b;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.35 system-ui, "Segoe UI", Arial, sans-serif; }
h1, h2, h3, .title { font-family: "Russo One", system-ui, sans-serif; font-weight: normal; margin: 0; }
button { font: inherit; cursor: pointer; border: 1px solid #9c9178; background: #fffaf0; border-radius: 6px; padding: 4px 9px; }
button:hover:not(:disabled) { background: #fff3cf; }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.primary:hover:not(:disabled) { background: #a8491a; }
button.small { padding: 1px 6px; font-size: 12px; }
select, input { font: inherit; padding: 3px 5px; border: 1px solid #9c9178; border-radius: 5px; background: #fff; }

#topbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #2b2a26; color: #f6f1e4; flex-wrap: wrap; }
#topbar .title { font-size: 20px; letter-spacing: .5px; margin-right: 8px; }
#status { font-weight: 600; }
#status .who { display: inline-block; padding: 1px 8px; border-radius: 10px; margin-left: 4px; }
#topbar .spacer { flex: 1; }
#topbar button { background: #3d3b35; color: #f6f1e4; border-color: #5a574e; }
#topbar button:hover:not(:disabled) { background: #4e4b43; }
#topbar button.primary { background: var(--accent); border-color: #c4602a; }

#main { display: flex; gap: 12px; padding: 12px; align-items: flex-start; }
#boardWrap { position: relative; flex: none; }
#board { position: relative; background-size: cover; border-radius: 4px; box-shadow: 0 2px 10px rgba(0,0,0,.35); user-select: none; }
.piece { position: absolute; pointer-events: none; transition: left .15s, top .15s; }
.unit img, .camp img, .tok img { width: 100%; height: 100%; display: block; }
.unit { border-radius: 50%; }
.unit.sel, .camp.sel { box-shadow: 0 0 0 3px var(--sel), 0 0 12px var(--sel); border-radius: 50%; }
.camp.sel { border-radius: 6px; }
.hp { position: absolute; left: 50%; bottom: -3px; transform: translateX(-50%); background: rgba(0,0,0,.78); color: #fff; font-size: 10px; padding: 0 4px; border-radius: 6px; white-space: nowrap; font-weight: 700; }
.hp.hurt { background: var(--bad); }
.badge { position: absolute; top: -3px; right: -3px; background: #1971c2; color: #fff; font-size: 9px; border-radius: 6px; padding: 0 3px; font-weight: 700; }
.done { position: absolute; top: -3px; left: -3px; background: #555; color: #fff; font-size: 9px; border-radius: 6px; padding: 0 3px; }
.hl { position: absolute; pointer-events: none; border-radius: 3px; }
.hl.move { background: rgba(255, 212, 59, .38); box-shadow: inset 0 0 0 2px rgba(255,190,0,.9); }
.hl.target { background: rgba(201, 42, 42, .30); box-shadow: inset 0 0 0 3px rgba(201,42,42,.95); }
.hl.place { background: rgba(43, 138, 62, .35); box-shadow: inset 0 0 0 2px rgba(43,138,62,.95); }
#tip { position: fixed; z-index: 50; pointer-events: none; background: #fffdf6; border: 1px solid #9c9178; border-radius: 8px; padding: 8px 10px; max-width: 320px; box-shadow: 0 4px 14px rgba(0,0,0,.25); display: none; font-size: 13px; }
#tip b { font-family: "Russo One", sans-serif; font-weight: normal; }
#tip .stats { font-variant-numeric: tabular-nums; margin: 3px 0; }
#tip .note { color: var(--muted); font-size: 12px; }

#side { flex: 1; min-width: 360px; display: flex; flex-direction: column; gap: 10px; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.box h3 { font-size: 15px; margin-bottom: 6px; }
.players { display: flex; flex-wrap: wrap; gap: 6px; }
.ptab { border-radius: 7px; padding: 4px 8px; border: 2px solid transparent; cursor: pointer; font-size: 13px; }
.ptab.viewing { border-color: #222; }
.ptab.turn::after { content: " \25C0"; }
.ptab.out { opacity: .4; text-decoration: line-through; }
.res { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
.res .r { display: flex; align-items: center; gap: 4px; }
.res .v { font-family: "Russo One", sans-serif; font-size: 20px; min-width: 26px; text-align: center; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.cards { display: flex; gap: 6px; flex-wrap: wrap; }
.card { position: relative; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.3); cursor: pointer; background-repeat: no-repeat; flex: none; }
.card.sel { outline: 3px solid var(--sel); }
.card.used { filter: grayscale(.8) brightness(.8); }
.card .tag { position: absolute; left: 2px; bottom: 2px; background: rgba(0,0,0,.75); color: #fff; font-size: 10px; border-radius: 4px; padding: 0 3px; }
.cardback { background: #1b2a41; border: 2px solid #f5c518; }
.inplay { display: flex; flex-direction: column; gap: 3px; }
.inplay .it { display: flex; gap: 6px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; font-size: 13px; }
.inplay .it .n { flex: 1; }
.muted { color: var(--muted); }
.hint { font-size: 12px; color: var(--muted); }
#log { height: 190px; overflow-y: auto; font-size: 12.5px; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
#log div { padding: 1px 0; border-bottom: 1px dotted #e6dfcc; }
#log .sys { color: var(--accent); font-weight: 600; }
#zoom { position: fixed; z-index: 60; pointer-events: none; display: none; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.45); background-repeat: no-repeat; }

.modal { position: fixed; inset: 0; background: rgba(20,18,14,.55); display: none; align-items: center; justify-content: center; z-index: 40; padding: 16px; }
.modal.open { display: flex; }
.modal .win { background: var(--panel); border-radius: 10px; padding: 16px; max-width: 980px; width: 100%; max-height: 92vh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
.modal .win h2 { font-size: 20px; margin-bottom: 10px; }
.seat { display: grid; grid-template-columns: 90px 1fr 1fr; gap: 8px; align-items: center; margin: 6px 0; }
.battle { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.battle .side { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.battle table { border-collapse: collapse; font-size: 13px; }
.battle td { padding: 1px 6px 1px 0; }
.result { margin-top: 10px; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px; white-space: pre-wrap; font-size: 13px; }
.refimg { width: 100%; height: auto; border-radius: 6px; }
@media (max-width: 1100px) { #main { flex-direction: column; } #side { min-width: 0; width: 100%; } }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #2b2a26; color: #fff; padding: 8px 14px; border-radius: 8px; z-index: 80; display: none; max-width: 90vw; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
.code { font-family: "Russo One", sans-serif; font-size: 34px; letter-spacing: 4px; background: #fff; border: 2px dashed var(--accent); border-radius: 8px; padding: 2px 14px; display: inline-block; }
.lob { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; align-items: center; margin: 4px 0; }
.choice { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.choice button { padding: 14px; text-align: left; width: 100%; }
#chat { display: none; gap: 6px; margin-top: 6px; } #chat input { flex: 1; }
#log .chat { color: #1864ab; }
#netInfo { font-size: 12px; opacity: .85; }
</style>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<div id="topbar">
  <span class="title">ELEMENTAL WAR</span>
  <span id="status"></span><span id="netInfo"></span>
  <span class="spacer"></span>
  <button id="btnDice">Roll dice</button>
  <button id="btnRef">Rules sheets</button>
  <button id="btnUndo">Undo</button>
  <button id="btnSave">Save file</button>
  <button id="btnLoad">Load file</button>
  <button id="btnNew">New game</button>
  <button id="btnEnd" class="primary">End turn</button>
</div>
<div id="main">
  <div id="boardWrap"><div id="board"></div></div>
  <div id="side">
    <div class="box"><div class="players" id="players"></div></div>
    <div class="box" id="playerBox"></div>
    <div class="box" id="selBox"></div>
    <div class="box"><h3>Log</h3><div id="log"></div><div id="chat"><input id="chatIn" placeholder="Message to everyone..." maxlength="200"><button id="btnChat">Send</button></div></div>
  </div>
</div>
<div id="tip"></div>
<div id="zoom"></div>
<input type="file" id="fileIn" accept=".json" style="display:none">

<div class="modal" id="startModal"><div class="win" style="max-width:760px">
  <h2>Elemental War</h2>
  <div class="row" style="margin-bottom:12px"><label>Your name <input id="myName" maxlength="20" placeholder="Name"></label></div>
  <div class="choice">
    <button id="chLocal"><b>Play on this computer</b><br><span class="hint">Everyone shares one screen (pass and play).</span></button>
    <button id="chHost"><b>Host an online game</b><br><span class="hint">Get a room code to send to your friends.</span></button>
    <div><button id="chJoin"><b>Join an online game</b><br><span class="hint">Type the host's room code below.</span></button>
      <input id="joinCode" placeholder="Room code" maxlength="5" style="margin-top:6px;width:100%;text-transform:uppercase"></div>
  </div>
  <div id="startMsg" class="hint" style="margin-top:10px"></div>
  <div class="row" id="resumeRow" style="margin-top:10px"></div>
</div></div>
<div class="modal" id="lobbyModal"><div class="win" style="max-width:720px"><div id="lobbyBody"></div></div></div>
<div id="toast"></div>
<div class="modal" id="setupModal"><div class="win" style="max-width:620px">
  <h2>New game</h2>
  <p class="hint">Pick 2 to 4 players. Each player chooses a faction and a corner of the board. Turn order always follows the faction order (Conquerors first, Paladins last).</p>
  <div class="row"><label>Players <select id="nPlayers"><option>2</option><option>3</option><option selected>4</option></select></label>
  <label style="margin-left:14px"><input type="checkbox" id="optAuto" checked> Auto income &amp; upkeep</label></div>
  <div id="seats" style="margin-top:8px"></div>
  <div class="row" style="margin-top:12px; justify-content:flex-end"><button id="btnCancelSetup">Cancel</button><button id="btnStart" class="primary">Start game</button></div>
</div></div>

<div class="modal" id="battleModal"><div class="win" style="max-width:760px"><div id="battleBody"></div></div></div>
<div class="modal" id="refModal"><div class="win"><div class="row" id="refTabs" style="margin-bottom:8px"></div><div id="refBody"></div>
  <div class="row" style="justify-content:flex-end;margin-top:8px"><button onclick="closeModal('refModal')">Close</button></div></div></div>
<div class="modal" id="msgModal"><div class="win" style="max-width:520px"><div id="msgBody"></div>
  <div class="row" style="justify-content:flex-end;margin-top:12px" id="msgBtns"></div></div></div>

// ---------- board lookups ----------
function unitAt(r, c) { return S.units.find(u => u.r === r && u.c === c); }
function tokenAt(r, c) { return S.tokens.find(t => t.r === r && t.c === c); }
function campAt(r, c) {
  for (const p of S.players) if (!p.out && campCells(p.cor).some(q => q[0] === r && q[1] === c)) return p;
  return null;
}
function isCampSquare(r, c) { return terrain(r, c) === "camp"; }
function heldBy(r, c) {   // player key holding this Outpost (Control marker) or Town (CAPTURED token)
  const t = tokenAt(r, c); if (!t) return null;
  if (t.kind === "control" || (t.kind === "capture" && t.captured)) return t.f;
  return null;
}
function heartHolder() {
  const on = S.units.filter(u => isHeart(u.r, u.c)); const owners = [...new Set(on.map(u => u.f))];
  return owners.length === 1 ? owners[0] : null;
}
function adjacentCells(r, c) { return [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]].filter(p => p[0] >= 0 && p[0] < N && p[1] >= 0 && p[1] < N); }

// ---------- movement ----------
function movAllowance(u) {
  let m = unitStats(u).MOV;
  const near = adjacentCells(u.r, u.c).some(q => { const o = unitAt(q[0], q[1]); return o && o.f !== u.f && o.cls === "Juggernaut"; });
  if (near) m -= 1;    // enemy Juggernaut next to it
  if (S.players[pIndex(u.f)].gust === S.round) m += 1;
  return Math.max(0, m);
}
function canMoveNow(u) {
  if (S.phase !== "building" || cur().f !== u.f) return "It is not this unit's Building turn.";
  if (u.moved === S.round) return "This unit already moved this turn.";
  if (u.recruited === S.round && u.f !== "fire") return "Soldiers recruited this turn can't move yet.";
  return "";
}
function reachable(u) {   // squares the unit can end on (orthogonal steps, 1 MOV each)
  const max = movAllowance(u), passAll = u.f === "air", riverFree = u.f === "air" || u.f === "water";
  const best = new Map(), out = new Set(), q = [[u.r, u.c, 0]];
  best.set(key(u.r, u.c), 0);
  while (q.length) {
    const [r, c, d] = q.shift();
    if (d >= max) continue;
    for (const [nr, nc] of adjacentCells(r, c)) {
      if (isCampSquare(nr, nc)) continue;
      const hb = heldBy(nr, nc); if (hb && hb !== u.f) continue;      // held objectives are closed to enemies
      const occ = unitAt(nr, nc);
      if (occ && !(passAll)) continue;
      const nd = d + 1, k = key(nr, nc);
      if (best.has(k) && best.get(k) <= nd) continue;
      best.set(k, nd);
      if (!occ) out.add(k);
      const stops = terrain(nr, nc) === "river" && !riverFree;          // entering a river ends movement
      if (!stops) q.push([nr, nc, nd]);
    }
  }
  return out;
}

// ---------- combat helpers ----------
function inDeployOrNextToCamp(u) {
  const p = S.players[pIndex(u.f)];
  if (deployCells(p.cor).some(q => q[0] === u.r && q[1] === u.c)) return true;
  return adjacentCells(u.r, u.c).some(q => campCells(p.cor).some(x => x[0] === q[0] && x[1] === q[1]));
}
function rangeOf(u) {
  let rng = unitStats(u).RNG;
  if (u.f === "nature" && u.cls === "Archer" && terrain(u.r, u.c) === "forest") rng += 1;
  return rng;
}
function distToCamp(u, p) { return Math.min(...campCells(p.cor).map(q => dist([u.r, u.c], q))); }
// Fighting numbers for a unit, with the automatic bonuses (terrain, faction, class abilities) listed.
function fighter(u, foe, attacking) {
  const st = unitStats(u), notes = [], t = terrain(u.r, u.c);
  st.atkMod = 0; st.defMod = 0; st.barMod = 0; st.canDodge = true;
  const cls = DATA.classes[u.cls];
  if (t === "forest") { st.SPD += 2; notes.push("Forest: +2 SPD"); }
  if (t === "hills" && u.f !== "air") { st.DEF += 1; st.BAR += 1; notes.push("Hills: +1 DEF, +1 BAR"); }
  if (t === "river") { st.canDodge = false; notes.push("In a river: can't dodge"); if (u.f === "water") { st.DEF += 2; st.BAR += 2; notes.push("River-born: +2 DEF, +2 BAR"); } }
  if (u.f === "earth" && inDeployOrNextToCamp(u)) { st.DEF += 2; st.BAR += 2; notes.push("Stoneskin: +2 DEF, +2 BAR"); }
  if (adjacentCells(u.r, u.c).some(q => { const o = unitAt(q[0], q[1]); return o && o.f === u.f && o.cls === "Knight" && o !== u; })) { st.DEF += 1; notes.push("Guard (Knight next to it): +1 DEF"); }
  if (foe && foe.unit) {
    const ff = DATA.classes[foe.unit.cls].family;
    if (u.cls === "Impaler" && ff === "Armor") { st.ATK += 2; notes.push("Impaler vs Armor: +2 ATK"); }
    if (u.cls === "Archer" && ff === "Magic") { st.ATK += 1; notes.push("Archer vs Magic: +1 ATK"); }
  }
  if (foe && foe.camp && u.f === "nature") { st.ATK -= 2; notes.push("Tribalists vs Camp: -2 ATK"); }
  if (attacking && u.f === "fire" && u.cls === "Juggernaut") { st.ATK += 1; notes.push("Conquerors Juggernaut attacking: +1 ATK"); }
  for (const cr of u.cards || []) if (cr.faceUp && cardDef(cr).type === "Battle") notes.push("Battle card under it: " + cardDef(cr).name + " (add its bonus below)");
  st.type = cls.type; st.notes = notes;
  return st;
}
function strike(att, def, label) {
  const lines = [];
  const armour = att.type === "M" ? def.BAR + def.barMod : def.DEF + def.defMod;
  const base = att.ATK + att.atkMod - armour;
  const nd = def.camp ? 1 : 1 + ((att.SPD - def.SPD) >= 3 ? 1 : 0);
  const rolls = []; for (let i = 0; i < nd; i++) rolls.push(d6());
  let dmg = Math.max(0, base + rolls.reduce((a, b) => a + b, 0));
  lines.push(`${label}: ATK ${att.ATK + att.atkMod} - ${att.type === "M" ? "BAR" : "DEF"} ${armour} = ${base}, +${nd} die: [${rolls.join(", ")}] -> ${dmg} damage`);
  if (def.canDodge && !def.camp && dmg > 0) {
    const a = d6(), b = d6(), tot = a + b + def.LCK;
    if (tot >= 12) { lines.push(`   Dodge roll ${a}+${b}${def.LCK ? "+" + def.LCK + " LCK" : ""} = ${tot}: DODGED, no damage!`); dmg = 0; }
    else lines.push(`   Dodge roll ${a}+${b}${def.LCK ? "+" + def.LCK + " LCK" : ""} = ${tot}: no dodge (needs 12+)`);
  }
  return { dmg, lines };
}

// ---------- cards ----------
function cardDef(ref) { return ref.u !== undefined ? DATA.cards[ref.u] : FAC[ref.f].cards[ref.i]; }
function cardSprite(ref) {
  if (ref.u !== undefined) return { url: A + "cards_front.png", col: ref.u % 5, row: Math.floor(ref.u / 5), cols: 5, rows: Math.ceil(DATA.cards.length / 5) };
  return { url: A + "fcards_" + ref.f + ".png", col: ref.i % 5, row: Math.floor(ref.i / 5), cols: 5, rows: 2 };
}
function cardStyle(ref, w) {
  const s = cardSprite(ref), h = w * CH / CW;
  return `width:${w}px;height:${h}px;background-image:url('${s.url}');background-size:${s.cols * w}px ${s.rows * h}px;background-position:-${s.col * w}px -${s.row * h}px`;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function draw(p, n) {
  let got = 0;
  for (let k = 0; k < n; k++) {
    if (!S.deck.length) {
      if (!S.discard.length) break;
      S.deck = shuffle(S.discard.splice(0)); log("The Universal deck ran out: the Discard Pile was shuffled into a new deck.", "sys");
    }
    p.hand.push(S.deck.pop()); got++;
  }
  return got;
}
function timerOf(def) { const m = /Timer (\d+)/.exec(def.text); return m ? +m[1] : 0; }

// ---------- setup ----------
function openSetup() {
  const n = +$("nPlayers").value, keys = DATA.factions.map(f => f.key), cors = Object.keys(CORNERS);
  let h = "";
  for (let i = 0; i < n; i++) {
    h += `<div class="seat"><b>Player ${i + 1}</b><select class="sf">${DATA.factions.map((f, j) => `<option value="${f.key}" ${j === i ? "selected" : ""}>${f.order}. ${esc(f.title)}</option>`).join("")}</select>
      <select class="sc">${cors.map((c, j) => `<option value="${c}" ${j === i ? "selected" : ""}>${CORNERS[c].name} corner</option>`).join("")}</select></div>`;
  }
  $("seats").innerHTML = h;
  $("setupModal").classList.add("open");
}
function startGame() {
  const fs = [...document.querySelectorAll("#seats .sf")].map(s => s.value), cs = [...document.querySelectorAll("#seats .sc")].map(s => s.value);
  if (new Set(fs).size !== fs.length) return alert("Each player needs a different faction.");
  if (new Set(cs).size !== cs.length) return alert("Each player needs a different corner.");
  $("setupModal").classList.remove("open");
  startGameWith(fs.map((f, i) => ({ f, cor: cs[i], name: "" })), $("optAuto").checked);
}
function startGameWith(seatList, auto) {
  if (S && isHost()) snapshot();
  S = blankState(); S.auto = auto;
  const seats = seatList.slice().sort((a, b) => FAC[a.f].order - FAC[b.f].order);
  for (const s of seats) S.players.push({ f: s.f, cor: s.cor, name: s.name || "", food: DATA.econ.StartFood, money: DATA.econ.StartMoney, hand: [], inplay: [], fUsed: {}, campDmg: 0, out: false });
  if (net.role === "host") { S.online = { code: net.code, seats: {} }; for (const s of seats) S.online.seats[s.f] = s.name; net.seat = seatOf(net.name); }
  DATA.cards.forEach((c, i) => { for (let k = 0; k < c.copies; k++) S.deck.push(i); });
  shuffle(S.deck);
  for (const p of S.players) {
    draw(p, 3);
    for (const [a, b] of [[0, 2], [2, 0]]) { const [r, c] = cornerCell(p.cor, a, b); S.units.push({ id: S.nextId++, f: p.f, cls: "Soldier", r, c, dmg: 0, cards: [] }); }
  }
  log("New game: " + S.players.map(p => FAC[p.f].title + " (" + CORNERS[p.cor].name + ")").join(", ") + ". Each player starts with 2 Soldiers and 3 cards.", "sys");
  S.phase = "building"; S.turn = 0;
  ui = { view: 0, sel: null, mode: null, cardSel: null, showHand: false, freeMove: false };
  startBuildingTurn();
  if (net.seat) ui.view = pIndex(net.seat);
  S.ver = 1; save(); render(); netPush(0);
}

// ---------- turn flow ----------
function startBuildingTurn() {
  const p = cur(), F = FAC[p.f];
  log(`Round ${S.round} - ${F.title}: Building turn.`, "sys");
  if (S.auto) {
    let food = DATA.econ.FoodIncome, money = econFor("MoneyIncome", p.f); const parts = [`base +${food} Food +${money} Money`];
    const outp = S.tokens.filter(t => t.kind === "control" && t.f === p.f).length;
    const towns = S.tokens.filter(t => t.kind === "capture" && t.captured && t.f === p.f).length;
    if (outp) { food += outp * DATA.econ.OutpostFood; parts.push(`${outp} Outpost(s) +${outp * DATA.econ.OutpostFood} Food`); }
    if (towns) { money += towns * DATA.econ.TownMoney; parts.push(`${towns} Town(s) +${towns * DATA.econ.TownMoney} Money`); }
    for (const ip of p.inplay) { const d = cardDef(ip), e = DATA.autoEngines[d.name]; if (e && ip.u !== undefined) { food += e.food; money += e.money; parts.push(d.name); } }
    if (heartHolder() === p.f) { food += 1; money += 1; parts.push("Heart +1 Food +1 Money"); }
    p.food += food; p.money += money;
    log(`${F.title} income: +${food} Food, +${money} Money (${parts.join("; ")}). Other Engines and passives: add by hand.`);
  }
  const n = draw(p, 2 + (heartHolder() === p.f ? 1 : 0));
  log(`${F.title} draws ${n} card(s)${heartHolder() === p.f ? " (Heart: +1)" : ""}.`);
  for (const ip of p.inplay) { const d = cardDef(ip); if (d.type === "Project" && ip.markers > 0) { ip.markers--; if (!ip.markers) log(`${F.title}'s Project ${d.name} is now ACTIVE.`, "sys"); } }
  if (p.f === "nature") for (const u of S.units.filter(u => u.f === "nature" && u.dmg > 0 && terrain(u.r, u.c) === "forest")) { u.dmg = Math.max(0, u.dmg - 2); log(`Regrowth: ${F.title} ${u.cls} heals 2.`); }
  ui.view = S.turn; ui.showHand = false; ui.sel = null; ui.mode = null; ui.cardSel = null;
}
function startActionTurn() {
  log(`Round ${S.round} - ${FAC[cur().f].title}: Action turn (battles).`, "sys");
  ui.view = S.turn; ui.showHand = false; ui.sel = null; ui.mode = null; ui.cardSel = null;
}
function nextAlive(from) { for (let i = from; i < S.players.length; i++) if (alive(S.players[i])) return i; return -1; }
function endTurn() {
  const p = cur();
  if (S.phase === "building" && p.hand.length > handLimit(p.f)) {
    return msg(`<h2>Too many cards</h2><p>${esc(FAC[p.f].title)} has ${p.hand.length} cards; the hand limit is ${handLimit(p.f)}. Discard ${p.hand.length - handLimit(p.f)} first (select a card in your hand, then Discard).</p>`);
  }
  act("end turn", () => {
    const nx = nextAlive(S.turn + 1);
    if (nx >= 0) { S.turn = nx; S.phase === "building" ? startBuildingTurn() : startActionTurn(); return; }
    if (S.phase === "building") { S.phase = "action"; S.turn = nextAlive(0); startActionTurn(); return; }
    endOfRound();
    S.round++; S.phase = "building"; S.turn = nextAlive(0); startBuildingTurn();
  });
}
function endOfRound() {
  log(`End of round ${S.round}: claim objectives, then upkeep.`, "sys");
  for (const p of S.players.filter(alive)) {
    const F = FAC[p.f];
    // Outposts: a unit that is on it now (and no enemy on it) claims it with a Control marker.
    for (const k of OUTPOST) {
      const r = Math.floor(k / N), c = k % N; if (tokenAt(r, c)) continue;
      const mine = (p.f === "nature") ? (unitAt(r, c) ? unitAt(r, c).f === p.f : adjacentCells(r, c).some(q => { const o = unitAt(q[0], q[1]); return o && o.f === p.f; }))
                                      : (unitAt(r, c) && unitAt(r, c).f === p.f);
      if (mine && !(unitAt(r, c) && unitAt(r, c).f !== p.f)) { S.tokens.push({ kind: "control", f: p.f, r, c }); log(`${F.title} claims an Outpost (Control marker placed).`); }
    }
    // Towns: first round places a CAPTURING token, the next round flips it to CAPTURED.
    for (const k of TOWN) {
      const r = Math.floor(k / N), c = k % N, t = tokenAt(r, c), u = unitAt(r, c);
      const here = u ? u.f === p.f : (p.f === "nature" && adjacentCells(r, c).some(q => { const o = unitAt(q[0], q[1]); return o && o.f === p.f; }));
      if (t && t.f === p.f && !t.captured) {
        if (here) { t.captured = true; log(`${F.title} CAPTURES a Town (+${DATA.econ.TownMoney} Money each Income).`); }
        else { S.tokens.splice(S.tokens.indexOf(t), 1); log(`${F.title} left a Town before capturing it: token removed.`); }
      } else if (!t && here && !(u && u.f !== p.f)) { S.tokens.push({ kind: "capture", f: p.f, r, c, captured: false }); log(`${F.title} starts capturing a Town (CAPTURING token placed).`); }
    }
  }
  if (S.auto) for (const p of S.players.filter(alive)) {
    const n = S.units.filter(u => u.f === p.f).length, cost = n * DATA.econ.Upkeep, F = FAC[p.f];
    if (p.food >= cost) { p.food -= cost; log(`${F.title} pays upkeep: ${cost} Food for ${n} units.`); }
    else { const short = cost - p.food; p.food = 0; log(`${F.title} can't pay upkeep (${cost} Food): remove ${short} unit(s), promoted units before Soldiers.`, "sys"); }
  }
}

// ---------- actions ----------
function recruitCells(p) {
  const cells = deployCells(p.cor).filter(q => !unitAt(q[0], q[1]));
  for (const t of S.tokens) if (t.kind === "control" && t.f === p.f && !unitAt(t.r, t.c)) cells.push([t.r, t.c]);
  return cells;
}
function startRecruit() {
  const p = P(ui.view);
  if (!owns(p.f) || !myTurn()) return toast("You can only recruit for yourself, on your own turn.");
  if (S.units.filter(u => u.f === p.f).length >= DATA.econ.MaxUnits) return msg("<h2>Army full</h2><p>You already have the maximum of 10 units.</p>");
  if (p.food < 1) return msg("<h2>Not enough Food</h2><p>Recruiting costs 1 Food.</p>");
  ui.mode = { kind: "recruit" }; ui.sel = null; render();
}
function promote(u, cls) {
  if (!owns(u.f) || !myTurn()) return toast("You can only promote your own units, on your turn.");
  const p = S.players[pIndex(u.f)], food = econFor("PromoteFood", u.f), money = econFor("PromoteMoney", u.f);
  if (p.food < food || p.money < money) return msg(`<h2>Can't afford it</h2><p>Promoting costs ${food} Food + ${money} Money.</p>`);
  act("promote", () => { p.food -= food; p.money -= money; u.cls = cls; u.dmg = 0; log(`${FAC[u.f].title} promotes a Soldier to ${cls} (-${food} Food, -${money} Money).`); });
}
function removeUnit(u, why) {
  for (const cr of u.cards || []) if (cr.u !== undefined) S.discard.push(cr.u);
  S.units.splice(S.units.indexOf(u), 1);
  log(`${FAC[u.f].title} ${u.cls} is ${why || "removed"}.`);
  if (ui.sel && ui.sel.unit === u.id) ui.sel = null;
}
function eliminate(p, by) {
  p.out = true;
  for (const u of S.units.filter(u => u.f === p.f)) removeUnit(u, "removed (its faction was knocked out)");
  S.tokens = S.tokens.filter(t => t.f !== p.f);
  for (const c of p.hand) S.discard.push(c); p.hand = [];
  for (const ip of p.inplay) if (ip.u !== undefined) S.discard.push(ip.u); p.inplay = [];
  log(`${FAC[p.f].title}'s Camp is destroyed: they are knocked out!`, "sys");
  if (by) { const q = S.players[pIndex(by)]; q.food += 3; q.money += 3; draw(q, 2); log(`${FAC[by].title} gains 3 Food, 3 Money and 2 cards for destroying it.`); }
  const left = S.players.filter(alive);
  if (left.length === 1) { log(`${FAC[left[0].f].title} WINS - the last Camp standing!`, "sys"); setTimeout(() => msg(`<h2>${esc(FAC[left[0].f].title)} win!</h2><p>Theirs is the last Camp standing.</p>`), 50); }
}

// Play a card from the hand (Universal) or the faction row.
function playCard(p, ref, fromHand) {
  if (!owns(p.f)) return toast("Those aren't your cards.");
  const d = cardDef(ref), F = FAC[p.f];
  if (p.money < d.cost) return msg(`<h2>Not enough Money</h2><p>${esc(d.name)} costs ${d.cost} Money.</p>`);
  const attach = d.type === "Battle" || d.type === "Setup" || /^Attach/.test(d.text);
  if (attach) { ui.mode = { kind: "attach", ref, fromHand, p: S.players.indexOf(p) }; ui.sel = null; render(); return; }
  act("play card", () => {
    p.money -= d.cost;
    if (fromHand) p.hand.splice(p.hand.indexOf(ref.u), 1);
    const emp = d.emp && heartHolder() === p.f ? ` EMPOWERED (holds the Heart): ${d.emp}` : "";
    if (d.type === "Engine" || d.type === "Project") {
      p.inplay.push(Object.assign({}, ref, { markers: timerOf(d) }));
      log(`${F.title} plays ${d.name} (${d.type}, -${d.cost} Money)${d.type === "Project" ? `, ${timerOf(d)} markers` : ""}.${emp}`);
    } else {
      if (fromHand) S.discard.push(ref.u); else p.fUsed[ref.i] = stamp();
      log(`${F.title} plays ${d.name} (${d.type}, -${d.cost} Money): ${d.text}${emp}`);
    }
    ui.cardSel = null;
  });
}
function attachTo(u) {
  const m = ui.mode, p = S.players[m.p], d = cardDef(m.ref);
  if (u.f !== p.f) return;
  const faceUp = d.type !== "Setup";
  if (d.type === "Battle" && u.cards.some(c => c.faceUp && cardDef(c).type === "Battle")) return msg("<h2>One Battle card per unit</h2><p>This unit already has a Battle card.</p>");
  if (d.type === "Setup" && u.cards.some(c => !c.faceUp)) return msg("<h2>One Setup card per unit</h2><p>This unit already has a Setup card.</p>");
  act("attach", () => {
    p.money -= d.cost;
    if (m.fromHand) p.hand.splice(p.hand.indexOf(m.ref.u), 1); else p.fUsed[m.ref.i] = stamp();
    u.cards.push(Object.assign({}, m.ref, { faceUp }));
    log(`${FAC[p.f].title} puts ${faceUp ? d.name : "a face-down Setup card"} under a ${u.cls} (-${d.cost} Money).`);
    ui.mode = null; ui.cardSel = null;
  });
}
function discardFromHand(p, u) { if (!owns(p.f)) return toast("Those aren't your cards."); act("discard", () => { p.hand.splice(p.hand.indexOf(u), 1); S.discard.push(u); log(`${FAC[p.f].title} discards ${DATA.cards[u].name}.`); ui.cardSel = null; }); }

// ---------- battle ----------
function targetsFor(u) {
  const out = []; if (S.phase !== "action" || cur().f !== u.f || u.attacked === S.round) return out;
  const rng = rangeOf(u);
  for (const o of S.units) if (o.f !== u.f && dist([u.r, u.c], [o.r, o.c]) <= rng) out.push({ unit: o, r: o.r, c: o.c });
  for (const p of S.players) if (!p.out && p.f !== u.f && distToCamp(u, p) <= rng) for (const q of campCells(p.cor)) out.push({ camp: p, r: q[0], c: q[1] });
  for (const t of S.tokens) if (t.f !== u.f && dist([u.r, u.c], [t.r, t.c]) === 1 && !unitAt(t.r, t.c)) out.push({ token: t, r: t.r, c: t.c });
  return out;
}
function openBattle(u, tg) {
  if (tg.token) {
    return act("break", () => { S.tokens.splice(S.tokens.indexOf(tg.token), 1); u.attacked = S.round; log(`${FAC[u.f].title} ${u.cls} breaks ${FAC[tg.token.f].title}'s ${tg.token.kind === "control" ? "Control marker" : "capture token"}.`); });
  }
  const foe = tg.unit ? { unit: tg.unit } : { camp: tg.camp };
  const A1 = fighter(u, foe, true);
  let D1, dName;
  if (tg.unit) { D1 = fighter(tg.unit, { unit: u }, false); dName = `${FAC[tg.unit.f].title} ${tg.unit.cls}`; }
  else { const cp = tg.camp; D1 = { HP: FAC[cp.f].campHP, DEF: 3, BAR: 3, SPD: 0, LCK: 0, RNG: 0, atkMod: 0, defMod: 0, barMod: 0, canDodge: false, camp: true, notes: ["Camps never hit back and can't dodge. 1 damage die."] }; dName = `${FAC[cp.f].title} Camp`; }
  const counter = tg.unit && dist([u.r, u.c], [tg.unit.r, tg.unit.c]) <= rangeOf(tg.unit);
  const row = (st, k) => `<tr><td>${k}</td><td><b>${st[k]}</b></td></tr>`;
  const sideHtml = (title, st, hp, pre) => `<div class="side"><h3>${esc(title)}</h3><table>${["ATK", "DEF", "BAR", "SPD", "LCK"].map(k => row(st, k)).join("")}<tr><td>HP left</td><td><b>${hp}</b></td></tr></table>
    <div class="hint">${(st.notes || []).map(esc).join("<br>") || "No automatic bonuses."}</div>
    <div class="row" style="margin-top:6px">Card / other bonus: ATK <input type="number" id="${pre}A" value="0" style="width:52px"> DEF/BAR <input type="number" id="${pre}D" value="0" style="width:52px"></div></div>`;
  const dHP = tg.unit ? hpLeft(tg.unit) : FAC[tg.camp.f].campHP - tg.camp.campDmg;
  $("battleBody").innerHTML = `<h2>Battle</h2><div class="battle">${sideHtml("Attacker: " + FAC[u.f].title + " " + u.cls, A1, hpLeft(u), "a")}${sideHtml("Defender: " + dName, D1, dHP, "d")}</div>
    <p class="hint">Damage per strike = ATK - DEF (physical) or - BAR (magic) + 1 die, +1 die if SPD is 3+ higher. The target rolls 2 dice + LCK: 12+ dodges. ${counter ? "The defender is in range and will strike back if it survives." : (tg.unit ? "The defender is out of its range: no counterattack." : "")}</p>
    <div class="row" style="justify-content:flex-end"><button onclick="closeModal('battleModal')">Cancel</button><button class="primary" id="btnFight">Fight!</button></div><div id="bres"></div>`;
  $("battleModal").classList.add("open");

    let out = [];

      u.attacked = S.round;
      const s1 = strike(A1, D1, "Attack"); out.push(...s1.lines);

        tg.unit.dmg += s1.dmg;
        if (hpLeft(tg.unit) <= 0) { out.push(`${dName} is destroyed!`); removeUnit(tg.unit, "destroyed"); }
        else if (counter) {
          const s2 = strike(D1, A1, "Counterattack"); out.push(...s2.lines); u.dmg += s2.dmg;
          if (hpLeft(u) <= 0) { out.push(`The attacker is destroyed!`); removeUnit(u, "destroyed"); }
        }
      } else {
        tg.camp.campDmg += s1.dmg; out.push(`${dName}: ${Math.max(0, FAC[tg.camp.f].campHP - tg.camp.campDmg)} HP left.`);
        if (tg.camp.campDmg >= FAC[tg.camp.f].campHP) eliminate(tg.camp, u.f);

        if (w.cls === "Monk" && w.dmg > 0) { w.dmg -= 1; out.push(`${FAC[w.f].title} Monk heals 1.`); }
        const used = w.cards.filter(c => c.faceUp && cardDef(c).type === "Battle");
        for (const c of used) { w.cards.splice(w.cards.indexOf(c), 1); if (c.u !== undefined) S.discard.push(c.u); out.push(`${cardDef(c).name} is used up and discarded.`); }
      }

    });
    $("bres").innerHTML = `<div class="result">${out.map(esc).join("\n")}</div><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="primary" onclick="closeModal('battleModal')">Done</button></div>`;
    $("btnFight").disabled = true;
  };
}

  if (ui.mode && ui.mode.kind === "recruit") {
    const p = P(ui.view);
    if (owns(p.f) && recruitCells(p).some(q => q[0] === r && q[1] === c)) act("recruit", () => { p.food -= 1; S.units.push({ id: S.nextId++, f: p.f, cls: "Soldier", r, c, dmg: 0, cards: [], recruited: S.round }); log(`${FAC[p.f].title} recruits a Soldier (-1 Food).`); ui.mode = null; });
    return;
  }
  if (ui.mode && ui.mode.kind === "attach") { if (u) attachTo(u); return; }
  const selU = ui.sel && ui.sel.unit ? S.units.find(x => x.id === ui.sel.unit) : null;
  const ctl = selU && owns(selU.f) && myTurn();
  if (selU) {
    if (ctl && S.phase === "building" && !canMoveNow(selU) && reachable(selU).has(key(r, c)))
      return act("move", () => { log(`${FAC[selU.f].title} ${selU.cls} moves.`); selU.r = r; selU.c = c; selU.moved = S.round; });
    const tg = targetsFor(selU).find(t => t.r === r && t.c === c);
    if (ctl && tg && (!u || u.f !== selU.f)) return openBattle(selU, tg);
    if (ui.freeMove && (owns(selU.f) || isHost()) && !u && !isCampSquare(r, c)) return act("free move", () => { log(`${FAC[selU.f].title} ${selU.cls} is moved by hand.`); selU.r = r; selU.c = c; });
  }
  ui.sel = u ? { unit: u.id } : camp ? { camp: camp.f } : null;
  render();
}
function tipFor(r, c) {
  const u = unitAt(r, c), camp = campAt(r, c), t = tokenAt(r, c);
  let h = "";
  if (u) { const F = FAC[u.f], st = unitStats(u);
    h += `<b style="color:${F.color}">${esc(F.title)}</b> <b>${u.cls}</b> <span class="note">${DATA.classes[u.cls].family}, ${DATA.classes[u.cls].type === "M" ? "magic" : "physical"}</span>
      <div class="stats">HP ${hpLeft(u)}/${st.HP} &middot; ${statLine(st)}</div>`;
    const notes = [DATA.classes[u.cls].ability, ...unitNotes(u.f, u.cls)].filter(n => n && n !== "No ability.");
    if (notes.length) h += `<div class="note">${notes.map(esc).join("<br>")}</div>`;
    if (u.cards.length) h += `<div class="note">Cards under it: ${u.cards.map(c => c.faceUp ? esc(cardDef(c).name) : "1 face-down").join(", ")}</div>`;
  } else if (camp) { const F = FAC[camp.f]; h += `<b style="color:${F.color}">${esc(F.title)} Camp</b><div class="stats">HP ${F.campHP - camp.campDmg}/${F.campHP} &middot; DEF 3 &middot; BAR 3</div><div class="note">Destroy every other Camp to win.</div>`; }
  if (t) { h += `<div class="note">${esc(FAC[t.f].title)} ${t.kind === "control" ? "Control marker (holds this Outpost: +1 Food)" : t.captured ? "CAPTURED token (holds this Town: +2 Money)" : "CAPTURING token (captured at the end of next round if their unit stays)"}</div>`; }
  if (!h) {
    const tr = terrain(r, c), name = isHeart(r, c) ? "Heart" : TOWN.has(key(r, c)) ? "Town" : OUTPOST.has(key(r, c)) ? "Outpost" : tr === "camp" ? "" : tr[0].toUpperCase() + tr.slice(1);
    const info = { Heart: "+1 Food, +1 Money, +1 card while only your units are on it. The only way to Empower cards.", Town: "Stay 2 rounds to capture: +2 Money each Income.", Outpost: "Stay a round to claim: +1 Food each Income, and you can recruit here.",
      Forest: "+2 SPD.", Hills: "+1 DEF, +1 BAR.", River: "Entering ends movement. Units in a river can't dodge.", Plains: "No effect." }[name];
    if (name) h = `<b>${name}</b>${info ? `<div class="note">${info}</div>` : ""}`;
  }
  return h;
}
function onBoardMove(e) {
  const tip = $("tip"); const rc = S ? cellFromEvent(e) : null;
  const h = rc ? tipFor(rc[0], rc[1]) : "";
  if (!h) { tip.style.display = "none"; return; }
  tip.innerHTML = h; tip.style.display = "block";
  const x = Math.min(e.clientX + 16, window.innerWidth - tip.offsetWidth - 8), y = Math.min(e.clientY + 16, window.innerHeight - tip.offsetHeight - 8);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
// big card preview on hover
document.addEventListener("mousemove", e => {
  const z = $("zoom"), el = e.target.closest && e.target.closest("[data-zoom]");
  if (!el) { z.style.display = "none"; return; }
  const ref = JSON.parse(el.getAttribute("data-zoom")); z.setAttribute("style", cardStyle(ref, 240)); z.style.display = "block";
  const x = e.clientX + 260 > window.innerWidth ? e.clientX - 256 : e.clientX + 16, y = Math.min(e.clientY - 40, window.innerHeight - 345);
  z.style.left = x + "px"; z.style.top = Math.max(8, y) + "px";
});

// ---------- modals ----------
function closeModal(id) { $(id).classList.remove("open"); render(); }
function msg(html, buttons) {
  $("msgBody").innerHTML = html; const bb = $("msgBtns"); bb.innerHTML = "";
  (buttons || [["OK", null, true]]).forEach(([t, fn, prim]) => { const b = document.createElement("button"); b.textContent = t; if (prim) b.className = "primary"; b.onclick = () => { $("msgModal").classList.remove("open"); if (fn) fn(); }; bb.appendChild(b); });
  $("msgModal").classList.add("open");
}
function showRef(which) {
  const tabs = [["reference", "The Round"], ["classes", "Classes & terrain"], ...DATA.factions.map(f => ["mat_" + f.key, f.title])];
  $("refTabs").innerHTML = tabs.map(t => `<button class="small${t[0] === which ? " primary" : ""}" onclick="showRef('${t[0]}')">${esc(t[1])}</button>`).join("");
  $("refBody").innerHTML = `<img class="refimg" src="${A}${which}.png" alt="">`;
  $("refModal").classList.add("open");
}

// ---------- top bar ----------
$("btnEnd").onclick = () => { if (!S || S.phase === "setup") return; if (!myTurn() && !isHost()) return toast("It isn't your turn."); endTurn(); };
$("btnUndo").onclick = () => { if (!isHost()) return toast("Only the host can undo."); if (!undoStack.length) return; const v = S.ver || 0; S = JSON.parse(undoStack.pop()); S.ver = v + 1; ui.mode = null; ui.cardSel = null; save(); render(); netPush(v); };
$("btnNew").onclick = () => { if (net.role === "client") return toast("Only the host can start a new game."); if (net.role === "host") return showLobby(); openStart(""); };
$("btnCancelSetup").onclick = () => { $("setupModal").classList.remove("open"); if (!S) openStart(""); };
$("btnStart").onclick = startGame;
$("nPlayers").onchange = openSetup;
$("btnRef").onclick = () => showRef("reference");
$("btnDice").onclick = () => { const a = d6(), b = d6(); act("dice", () => log(`Dice: ${a} and ${b} (total ${a + b}).`)); };
$("btnSave").onclick = () => { const blob = new Blob([JSON.stringify(S)], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `elemental-war-round${S.round}.json`; a.click(); };
$("btnLoad").onclick = () => isHost() ? $("fileIn").click() : toast("Only the host can load a saved game.");
$("fileIn").onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { try { snapshot(); S = JSON.parse(t); ui = { view: S.turn, sel: null, mode: null, cardSel: null, showHand: false, freeMove: false }; if (online()) { if (!S.online) S.online = { code: net.code, seats: {} }; S.online.code = net.code; net.seat = seatOf(net.name); } S.ver = (S.ver || 0) + 1000; save(); render(); netPush(0); } catch (err) { alert("That file isn't an Elemental War save."); } }); e.target.value = ""; };
$("board").addEventListener("click", onBoardClick);
$("board").addEventListener("mousemove", onBoardMove);
$("board").addEventListener("mouseleave", () => $("tip").style.display = "none");
document.addEventListener("keydown", e => { if (e.key === "Escape") { ui.mode = null; ui.sel = null; ui.cardSel = null; ["battleModal", "refModal", "msgModal"].forEach(m => $(m).classList.remove("open")); render(); } });
window.addEventListener("resize", () => { layout(); render(); });

// ---------- boot ----------
// ---------- start screen ----------
function sendChat() { const t = $("chatIn").value.trim(); if (!t || !S) return; $("chatIn").value = ""; act("chat", () => log(`${net.name}: ${t}`, "chat")); }
$("btnChat").onclick = sendChat;
$("chatIn").addEventListener("keydown", e => { if (e.key === "Enter") sendChat(); });
function openStart(code) {
  $("joinCode").value = code || ""; $("startMsg").textContent = "";
  let info = null, onl = null;
  try { info = JSON.parse(localStorage.getItem("elementalwar.netinfo")); onl = JSON.parse(localStorage.getItem("elementalwar.online")); } catch (e) {}
  $("resumeRow").innerHTML = info && info.role === "host" && onl && onl.online && onl.phase !== "setup" && !net.role
    ? `<button onclick="resumeHost()">Resume hosting room ${esc(info.code)} (round ${onl.round})</button>` : "";
  if (typeof Peer === "undefined") $("startMsg").textContent = "Online play needs an internet connection (the connection library didn't load). You can still play on this computer.";
  $("startModal").classList.add("open");
}
function needName() {
  const n = $("myName").value.trim();
  if (!n) { $("startMsg").textContent = "Type your name first."; $("myName").focus(); return null; }
  net.name = n; try { localStorage.setItem("elementalwar.name", n); } catch (e) {}
  return n;
}
$("chLocal").onclick = () => { $("startModal").classList.remove("open"); openSetup(); };
$("chHost").onclick = () => { if (!needName() || typeof Peer === "undefined" || net.role) return; hostGame(null, false); };
$("chJoin").onclick = () => {
  if (!needName() || typeof Peer === "undefined" || net.role) return;
  const c = $("joinCode").value.trim().toUpperCase();
  if (!/^[A-Z0-9]{5}$/.test(c)) { $("startMsg").textContent = "Type the 5-character room code."; return; }
  joinGame(c);
};
function resumeHost() {
  if (!needName()) return;
  const info = JSON.parse(localStorage.getItem("elementalwar.netinfo"));
  S = JSON.parse(localStorage.getItem("elementalwar.online"));
  hostGame(info.code, true);
}

// ---------- boot ----------
layout();
try { $("myName").value = net.name = localStorage.getItem("elementalwar.name") || ""; } catch (e) {}
(() => {
  const m = /join=([A-Za-z0-9]{5})/.exec(location.hash);
  let local = null; try { local = JSON.parse(localStorage.getItem("elementalwar.save")); } catch (e) {}
  if (!m && local && local.phase !== "setup") { S = local; ui.view = S.turn; render(); return; }
  openStart(m ? m[1].toUpperCase() : "");
})();
</script>
</body>
